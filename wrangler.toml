name = "clip-synced"
compatibility_date = "2024-01-01"
pages_build_output_dir = "public"

# --- Durable Object binding (powers /api/ws live push) ---
# No script_name here on purpose: the ClipRelay class is defined inside
# this same project's functions/ directory, not a separate Worker.
[[durable_objects.bindings]]
name = "CLIP_RELAY"
class_name = "ClipRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClipRelay"]

# D1 "DB" binding stays managed via the Pages dashboard (Settings -> Bindings),
# not declared here.
